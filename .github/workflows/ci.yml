name: CI

on:
  pull_request:
  push:
    branches: [main]

env:
  # prisma.config.ts requires DATABASE_URL to be *set* just to run
  # `prisma generate` (no connection is actually made) -- this is a
  # placeholder, not a real target. Real DB access happens against
  # Testcontainers-provisioned Postgres in the integration job.
  DATABASE_URL: postgresql://placeholder:placeholder@localhost:5432/placeholder

jobs:
  lint-and-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npx prisma generate
      - run: npm run lint -- --max-warnings=0
      - run: npx tsc --noEmit

  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npx prisma generate
      - run: npm test

  integration-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npx prisma generate
      # Testcontainers starts its own real Postgres per test file;
      # Docker is available out of the box on ubuntu-latest runners.
      - run: npm run test:integration
